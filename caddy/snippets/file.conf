# SSL_MODE=file
#
# Certificates are supplied by the deployment, such as those issued by an agency PKI.
# Set SSL_DIR to the host directory holding them. The files must be named server.crt
# and server.key. Caddy does not re-read them automatically after they are replaced;
# run `docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile` to pick up
# a renewed certificate.
tls /etc/caddy/tls/server.crt /etc/caddy/tls/server.key
