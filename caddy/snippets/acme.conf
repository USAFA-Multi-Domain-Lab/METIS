# SSL_MODE=acme (default)
#
# Certificates are obtained and renewed automatically from Let's Encrypt, which is
# Caddy's behavior when no tls directive is present. Requires the domain in DOMAIN to
# resolve publicly, and port 80 or 443 to be reachable from the internet.
#
# HSTS is set here rather than in the Caddyfile because it instructs browsers to refuse
# plain HTTP for the domain, which also makes certificate warnings impossible to bypass.
# That is only safe once the certificate is publicly trusted, so the staging, internal,
# and file modes deliberately leave it off.
header Strict-Transport-Security "max-age=31536000"
