# SSL_MODE=staging
#
# Certificates are obtained from Let's Encrypt's staging environment, which validates
# exactly as production does but issues from an untrusted root, so browsers show a
# warning. Its rate limits are effectively unlimited, where production allows only five
# failed validations per hostname per hour.
#
# Use this for the first bring-up of a new site. Once the logs report that a certificate
# was obtained, switch to SSL_MODE=acme for a trusted certificate. Caddy stores
# certificates per authority, so no cleanup is needed when switching.
tls {
	issuer acme {
		dir https://acme-staging-v02.api.letsencrypt.org/directory
	}
}
