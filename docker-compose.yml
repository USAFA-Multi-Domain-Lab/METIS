name: metis

services:
  mongodb:
    image: mongo:8.0.4
    env_file:
      - ./config/docker.defaults.env
      - .env
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./server/database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web-server:
    build:
      context: ./
      dockerfile: ./Dockerfile
    env_file:
      - ./config/docker.defaults.env
      - .env
    ports:
      # The container port and the default host port should match the one defined in docker.defaults.env.
      # Set BIND_ADDRESS to 127.0.0.1 when the caddy service fronts this one, so that METIS
      # is reachable only through the proxy.
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-8083}:${PORT:-8083}'
    volumes:
      - ./integration/target-env:/opt/metis/integration/target-env
      - metis_data:/opt/metis/server/files/store
      - metis_backups:/opt/metis/server/database/backups
    depends_on:
      mongodb:
        condition: service_healthy

  # Reverse proxy terminating HTTPS in front of the web server. Only started when the
  # 'tls' profile is active, which a deployment enables with COMPOSE_PROFILES=tls in .env.
  caddy:
    profiles: ['tls']
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_MODE: ${SSL_MODE:-acme}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
      PORT: ${PORT:-8083}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/snippets:/etc/caddy/snippets:ro
      - ${SSL_DIR:-./caddy/tls}:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-server

volumes:
  # MongoDB persistence
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

  # NodeJS/METIS application persistence
  metis_data:
    driver: local
  metis_backups:
    driver: local

  # Caddy persistence. caddy_data holds issued certificates and ACME account keys, and
  # must survive rebuilds so that certificates are not re-issued on every start.
  caddy_data:
    driver: local
  caddy_config:
    driver: local
